[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-transcript-mcp"
version = "0.1.0"
description = "Production-grade YouTube transcription MCP server: captions-first pipeline, local faster-whisper fallback, timestamped searchable transcripts"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "yt-dlp>=2025.6.9",
    "faster-whisper>=1.0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
youtube-transcript-mcp = "src.server.mcp_server:main"

[tool.setuptools]
packages = [
    "src",
    "src.config",
    "src.utils",
    "src.youtube",
    "src.transcription",
    "src.transcript",
    "src.cache",
    "src.jobs",
    "src.server",
    "src.server.tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
